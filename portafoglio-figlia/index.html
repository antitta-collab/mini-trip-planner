<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7"><link rel="manifest" href="manifest.json"><title>Portafoglio figlia</title><style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--line:#e5e5ea;--blue:#007aff;--green:#34c759;--red:#ff3b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color:var(--text)}main{max-width:760px;margin:auto;padding:18px 16px 32px}.nav{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 18px}.title{font-size:29px;font-weight:750;letter-spacing:-.8px}.sub{font-size:13px;color:var(--muted);margin-top:2px}.round{width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:var(--blue);font-size:22px}.hero,.form,.historycard,.list{background:var(--card);border-radius:22px}.hero{padding:21px 20px;margin-bottom:18px}.eyebrow,.label{font-size:13px;color:var(--muted)}.big{font-size:36px;font-weight:750;letter-spacing:-1.3px;margin-top:4px}.gain{font-size:16px;font-weight:600;margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.stat{background:#f2f2f7;border-radius:14px;padding:11px}.stat b{display:block;font-size:14px;margin-top:3px}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;padding:0 3px 8px}.sectiontitle{font-size:19px;font-weight:700}.count{font-size:13px;color:var(--muted)}.asset{padding:15px 16px;border-bottom:1px solid var(--line)}.asset:last-child{border-bottom:0}.assetmain{display:flex;align-items:center;gap:12px}.icon{width:42px;height:42px;border-radius:12px;background:#e9f2ff;color:var(--blue);display:grid;place-items:center;font-weight:700;flex:0 0 42px}.assetbody{min-width:0;flex:1}.assetname{font-size:15px;font-weight:650;line-height:1.22}.meta{font-size:12px;color:var(--muted);margin-top:3px}.right{text-align:right;min-width:94px}.value{font-size:15px;font-weight:650}.perf{font-size:12px;margin-top:3px}.actions{display:flex;gap:8px;margin:10px 0 0 54px}.small{min-height:34px;padding:0 11px;border:0;border-radius:9px;background:#f2f2f7;color:var(--blue);font:inherit}.delete{color:var(--red)}button{cursor:pointer}.add{width:100%;margin-top:10px;min-height:48px;border:0;border-radius:15px;background:var(--blue);color:white;font:600 15px inherit}.form{display:none;padding:16px;margin-top:10px}.form.open{display:block}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 3px}.field input,.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:#f9f9fb;padding:8px 12px;font:inherit;font-size:16px}.formactions{display:flex;gap:9px}.formactions button{flex:1;min-height:44px;border:0;border-radius:12px;font:600 15px inherit}.save{background:var(--blue);color:#fff}.cancel{background:#f2f2f7;color:var(--blue)}.historycard{padding:4px 16px}.historyrow{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.historyrow:last-child{border:0}.chart{background:var(--card);border-radius:22px;padding:14px 12px 10px;margin-top:4px}.chart svg{width:100%;height:180px;display:block}.note{font-size:12px;color:var(--muted);padding:8px 3px;line-height:1.35}.empty{padding:18px;color:var(--muted);font-size:14px}@media(max-width:520px){main{padding:15px 12px 28px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.big{font-size:33px}.right{min-width:82px}}
</style></head><body><main><div class="nav"><div><div class="title">Portafoglio</div><div class="sub">Investimenti di tua figlia</div></div><button class="round" id="topadd">＋</button></div><div class="hero"><div class="eyebrow">Valore totale</div><div class="big" id="total">€ 40.000,00</div><div class="gain positive" id="totalgain">+€ 0,00 · +0,00%</div><div class="stats"><div class="stat"><div class="label">Investito</div><b id="invested">€ 40.000,00</b></div><div class="stat"><div class="label">Guadagno</div><b id="profit">€ 0,00</b></div><div class="stat"><div class="label">Aggiornato</div><b id="updated">Oggi</b></div></div></div><section class="section"><div class="sectionhead"><div class="sectiontitle">Investimenti</div><div class="count" id="count">3 asset</div></div><div class="list" id="list"></div><button class="add" id="add">＋ Aggiungi investimento</button><div class="form" id="form"><form id="assetForm"><div class="field"><label>Nome investimento</label><input id="name" required placeholder="Es. ETF MSCI World"></div><div class="field"><label>Capitale investito (€)</label><input id="cost" required type="number" min="0" step="0.01" inputmode="decimal"></div><div class="field"><label>Valore attuale (€)</label><input id="value" required type="number" min="0" step="0.01" inputmode="decimal"></div><div class="formactions"><button class="save">Salva</button><button class="cancel" id="cancel" type="button">Annulla</button></div></form></div></section><section class="section"><div class="sectionhead"><div class="sectiontitle">Andamento</div><div class="count">Storico</div></div><div class="chart"><svg id="chart" viewBox="0 0 700 180" preserveAspectRatio="none"></svg></div></section><section class="section"><div class="sectionhead"><div class="sectiontitle">Storico mensile</div><button class="small" id="snapshot">＋ Salva mese</button></div><div class="historycard" id="history"></div><div class="note">Una valorizzazione mensile permette di seguire l'andamento del patrimonio nel tempo.</div></section></main><script>
const KEY='pf_figlia_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{assets:[{id:1,name:'ING Global Index Portfolio Conservative',cost:14000,value:14000},{id:2,name:'Amundi Cash Euro',cost:10000,value:10000},{id:3,name:'SISF QEP Global Quality',cost:16000,value:16000}],history:[{date:new Date().toISOString().slice(0,10),value:40000}]};let editing=null;const $=id=>document.getElementById(id);const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);const pct=n=>new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+'%';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function totals(){let i=state.assets.reduce((s,a)=>s+a.cost,0),v=state.assets.reduce((s,a)=>s+a.value,0);return{i,v,p:v-i,pct:i?(v-i)/i*100:0}}function render(){let t=totals();$('total').textContent=euro(t.v);$('totalgain').textContent=(t.p>=0?'+':'')+euro(t.p)+' · '+(t.pct>=0?'+':'')+pct(t.pct);$('totalgain').className='gain '+(t.p>=0?'positive':'negative');$('invested').textContent=euro(t.i);$('profit').textContent=euro(t.p);$('updated').textContent=new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});$('count').textContent=state.assets.length+' '+(state.assets.length===1?'asset':'asset');$('list').innerHTML=state.assets.length?'':'<div class="empty">Nessun investimento presente.</div>';state.assets.forEach(a=>{let p=a.value-a.cost,pp=a.cost?p/a.cost*100:0,d=document.createElement('div');d.className='asset';d.innerHTML='<div class="assetmain"><div class="icon">'+a.name.charAt(0).toUpperCase()+'</div><div class="assetbody"><div class="assetname"></div><div class="meta">Investito '+euro(a.cost)+'</div></div><div class="right"><div class="value">'+euro(a.value)+'</div><div class="perf '+(p>=0?'positive':'negative')+'">'+(p>=0?'+':'')+euro(p)+' · '+(pp>=0?'+':'')+pct(pp)+'</div></div></div><div class="actions"><button class="small edit">Modifica</button><button class="small delete del">Elimina</button></div>';d.querySelector('.assetname').textContent=a.name;d.querySelector('.edit').onclick=()=>openEdit(a);d.querySelector('.del').onclick=()=>{state.assets=state.assets.filter(x=>x.id!==a.id);save();render()};$('list').appendChild(d)});renderHistory();drawChart()}function renderHistory(){$('history').innerHTML=state.history.slice().reverse().map(h=>'<div class="historyrow"><span>'+new Date(h.date+'T00:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'})+'</span><strong>'+euro(h.value)+'</strong></div>').join('')}function drawChart(){let svg=$('chart'),h=state.history;if(h.length<2){svg.innerHTML='<text x="350" y="95" text-anchor="middle" fill="#8e8e93" font-size="14">Salva almeno due mesi per vedere l’andamento</text>';return}let vals=h.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals);if(max===min){min-=1;max+=1}let pts=h.map((x,i)=>{let X=20+i*(660/(h.length-1)),Y=155-(x.value-min)/(max-min)*130;return[X,Y]});let path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');svg.innerHTML='<line x1="20" y1="155" x2="680" y2="155" stroke="#e5e5ea"/><path d="'+path+'" fill="none" stroke="#007aff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+pts.at(-1)[0]+'" cy="'+pts.at(-1)[1]+'" r="5" fill="#007aff"/>'}function openForm(a){editing=a||null;$('form').classList.add('open');$('name').value=a?.name||'';$('cost').value=a?.cost??'';$('value').value=a?.value??'';$('name').focus()}function closeForm(){$('form').classList.remove('open');$('assetForm').reset();editing=null}$('add').onclick=()=>openForm();$('topadd').onclick=()=>openForm();$('cancel').onclick=closeForm;$('assetForm').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim(),cost=Number($('cost').value),value=Number($('value').value);if(!name||!Number.isFinite(cost)||cost<0||!Number.isFinite(value)||value<0)return;if(editing){Object.assign(editing,{name,cost,value})}else state.assets.push({id:Date.now(),name,cost,value});save();closeForm();render()};$('snapshot').onclick=()=>{let t=totals(),today=new Date().toISOString().slice(0,10),idx=state.history.findIndex(h=>h.date===today);if(idx>=0)state.history[idx].value=t.v;else state.history.push({date:today,value:t.v});save();render()};if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
