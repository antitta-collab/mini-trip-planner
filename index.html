<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINI Trip Planner — Test MINI 50 kW</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f4f5f7}
*{box-sizing:border-box} body{margin:0}.app{max-width:1180px;margin:auto;padding:20px}
header{padding:18px 4px 12px}.brand{font-size:28px;font-weight:800}.sub{color:#667085;margin-top:4px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}
.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:18px;box-shadow:0 4px 18px #00000008}
h2{font-size:16px;margin:0 0 14px} label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}
input,select,button{width:100%;height:42px;border:1px solid #d0d5dd;border-radius:10px;padding:0 12px;font:inherit;background:white}
button{cursor:pointer;font-weight:750}.primary{background:#18202a;color:white;border-color:#18202a;margin-top:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font-size:12px;color:#667085}.status{margin-top:12px;font-size:13px;min-height:18px}
#map{height:520px;border-radius:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stat{background:#f8f9fb;border-radius:12px;padding:12px}.stat b{display:block;font-size:19px;margin-top:3px}
.stop{border-top:1px solid #eaecf0;padding:13px 0}.stop:first-child{border-top:0}.stoptitle{font-weight:750}
.badge{display:inline-block;background:#eef2f6;border-radius:999px;padding:4px 8px;font-size:11px;margin-left:6px}
.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}#map{height:430px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">MINI Trip Planner</div><div class="sub">Pianificazione di viaggi elettrici</div></header>
<div class="grid">
<section class="card">
<h2>Viaggio</h2>
<label>Partenza</label><input id="from" value="Modena, Italia" placeholder="Es. Modena">
<label>Arrivo</label><input id="to" value="Siena, Italia" placeholder="Es. Siena">

<h2 style="margin-top:22px">Parametri auto</h2>
<div class="row">
<div><label>Batteria netta utilizzabile</label><input id="battery" type="number" value="29" min="1" step=".1"></div>
<div><label>Consumo autostrada</label><input id="consumption" type="number" value="15" min="1" step=".1"></div>
</div>
<div class="row">
<div><label>Velocità di riferimento</label><input id="speed" type="number" value="110" min="1" step="1"><span class="small">km/h</span></div>
<div><label>Profilo</label><input value="MINI — 29 kWh / 50 kW DC" disabled></div>
</div>
<div class="row">
<div><label>Carica partenza %</label><input id="startSoc" type="number" value="100" min="1" max="100"></div>
<div><label>Riserva minima %</label><input id="reserveSoc" type="number" value="15" min="0" max="90"></div>
</div>

<h2 style="margin-top:22px">Ricarica</h2>
<div class="row">
<div><label>Potenza minima DC (opzionale)</label><input id="minPower" type="number" value="0" min="0" placeholder="0 = qualsiasi"></div>
<div><label>Potenza max DC auto</label><input id="carMaxPower" type="number" value="50" min="1"><span class="small">kW</span></div></div><div class="row">
<div><label>Arrivo desiderato alla ricarica %</label><input id="arrivalSoc" type="number" value="25" min="1" max="90"><span class="small">Obiettivo: arrivare alla colonnina con margine</span></div>
<div><label>Ricarica target %</label><input id="targetSoc" type="number" value="75" min="1" max="100"></div>
</div>
<button class="primary" id="calc">CALCOLA VIAGGIO</button>
<div class="status" id="status"></div>
</section>

<section>
<div class="card"><div id="map"></div>
<div class="stats">
<div class="stat">Distanza<b id="distance">—</b></div>
<div class="stat">Tempo guida<b id="drive">—</b></div>
<div class="stat">Ricariche<b id="charges">—</b></div>
<div class="stat">Arrivo<b id="arrival">—</b></div>
</div></div>
<div class="card" style="margin-top:18px"><h2>Piano di viaggio</h2><div id="plan" class="small">Inserisci partenza e arrivo e premi “Calcola viaggio”.</div></div>
</section>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([44.65,10.92],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routeLayer=null, markers=[];
const $=id=>document.getElementById(id);
function clearMap(){if(routeLayer)map.removeLayer(routeLayer);markers.forEach(m=>map.removeLayer(m));markers=[]}
async function geocode(q){
 const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=it&q='+encodeURIComponent(q));
 if(!r.ok)throw Error('Errore geocoding');
 const d=await r.json(); if(!d.length)throw Error('Località non trovata: '+q);
 return {lat:+d[0].lat,lon:+d[0].lon,name:d[0].display_name};
}
async function route(a,b){
 const u=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;
 const r=await fetch(u); if(!r.ok)throw Error('Errore nel calcolo percorso');
 const d=await r.json(); if(!d.routes?.length)throw Error('Percorso non trovato');
 return d.routes[0];
}
async function chargers(points, minPower){
 // Query Overpass around the corridor bounding box; then keep points close to route.
 const lats=points.map(p=>p[1]), lons=points.map(p=>p[0]);
 const s=Math.max(0,Math.min(...lats)-.12), n=Math.min(90,Math.max(...lats)+.12), w=Math.min(...lons)-.12, e=Math.max(...lons)+.12;
 const q=`[out:json][timeout:25];(node["amenity"="charging_station"](${s},${w},${n},${e}););out;`;
 const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q});
 if(!r.ok)return [];
 const d=await r.json();
 return d.elements.map(x=>({lat:x.lat,lon:x.lon,tags:x.tags||{}})).map(x=>{
  const t=x.tags, raw=t.capacity || t["capacity:charging"] || t["capacity:dc"] || "";
  const vals=String(raw).match(/\\d+(?:[.,]\\d+)?/g)||[];
  const powers=vals.map(v=>+v.replace(",",".")).filter(v=>v>0&&v<1000);
  const p=+(t["maxpower"]||t["maxpower:dc"]||t["capacity:kw"]||powers[0]||0);
  x.power=p; return x;
}).filter(x=>!minPower || x.power>=minPower);
}
function hav(a,b){const R=6371, p=Math.PI/180; const dlat=(b[1]-a[1])*p,dlon=(b[0]-a[0])*p;const x=Math.sin(dlat/2)**2+Math.cos(a[1]*p)*Math.cos(b[1]*p)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtTime(sec){let m=Math.round(sec/60),h=Math.floor(m/60);m%=60;return h?`${h}h ${m}m`:`${m} min`}
function nearestDistance(pt, line){let best=1e9;for(const p of line){best=Math.min(best,hav(pt,p))}return best}
function planStops(totalKm, line, cs, battery, cons, start, min, target, desired){
 const ordered=cs.map(c=>({c,d:nearestDistance([c.lon,c.lat],line),along:line.reduce((acc,p,i)=>acc+(i?hav(line[i-1],p):0),0)}))
 .filter(x=>x.d<2.5).sort((a,b)=>a.along-b.along);
 const stops=[]; let pos=0, soc=start;
 const reachKm=(fromSoc,toSoc)=>Math.max(0,battery*(fromSoc-toSoc)/100/cons*100);
 while(totalKm-pos>1){
   const candidates=ordered.filter(x=>x.along>pos+15 && x.along<=pos+reachKm(soc,min));
   if(!candidates.length) break;
   let chosen=null,best=1e9;
   for(const x of candidates){
     const km=x.along-pos, arrival=soc-km*cons/battery;
     const alternatives=ordered.filter(y=>y!==x && y.along>x.along+3 &&
       (y.along-x.along)<=reachKm(target,min));
     const powerBonus=x.c.power?Math.min(x.c.power,carMaxPower)/50:0; const score=(alternatives.length?0:1000)+Math.abs(arrival-desired)+Math.max(0,desired-arrival)*2-powerBonus;
     if(score<best){best=score;chosen={...x,arrival,alternatives};}
   }
   const add=Math.max(0,target-chosen.arrival);
   stops.push({c:chosen.c,km:chosen.along,arrival:chosen.arrival,chargeTo:target,add,
     safe:chosen.alternatives.length>0,alternatives:chosen.alternatives.length});
   pos=chosen.along; soc=target;
   ordered.splice(ordered.indexOf(chosen),1);
   if(stops.length>20) break;
 }
 return {stops,arrivalSoc:soc-(totalKm-pos)*cons/battery};
}
async function calculate(){
 const status=$('status'); status.textContent='Calcolo percorso e ricerca delle stazioni…';
 $('plan').innerHTML=''; clearMap();
 try{
  const a=await geocode($('from').value), b=await geocode($('to').value);
  const rt=await route(a,b), totalKm=rt.distance/1000, line=rt.geometry.coordinates.map(p=>[p[1],p[0]]);
  L.polyline(line,{weight:5}).addTo(map); routeLayer=map._layers[Object.keys(map._layers).pop()];
  const ma=L.marker([a.lat,a.lon]).addTo(map).bindPopup('Partenza').openPopup();
  const mb=L.marker([b.lat,b.lon]).addTo(map).bindPopup('Arrivo');markers.push(ma,mb);
  map.fitBounds(L.latLngBounds(line),{padding:[25,25]});
  let cs=[];
  try{cs=await chargers(line,+$('minPower').value)}catch(e){}
  const battery=+$('battery').value, cons=+$('consumption').value, start=+$('startSoc').value, min=+$('reserveSoc').value, target=+$('targetSoc').value, desired=+$('arrivalSoc').value, carMaxPower=+$('carMaxPower').value, speed=+$('speed').value;
  if(![battery,cons,start,min,target,desired,carMaxPower,speed].every(Number.isFinite)) throw Error('Controlla i parametri dell’auto e della ricarica.');
  const p=planStops(totalKm,line,cs,battery,cons,start,min,target,desired);
  $('distance').textContent=totalKm.toFixed(0)+' km'; $('drive').textContent=fmtTime(totalKm/speed*3600);
  $('charges').textContent=p.stops.length; $('arrival').textContent=Math.max(0,p.arrivalSoc).toFixed(0)+'%';
  const totalEnergy=totalKm*cons/100; let html=`<div><b>${a.name.split(',')[0]} → ${b.name.split(',')[0]}</b></div><div class="small" style="margin-top:6px">Profilo MINI: ${battery} kWh netti · ${cons} kWh/100 km · ${speed} km/h · DC max ${carMaxPower} kW</div><div class="small" style="margin-top:4px">Energia teorica per la tratta: ~${totalEnergy.toFixed(1)} kWh</div>`;
  if(!p.stops.length) html+=`<p>Nessuna sosta necessaria secondo i parametri impostati. Batteria stimata all'arrivo: <b>${Math.max(0,p.arrivalSoc).toFixed(0)}%</b>.</p>`;
  else p.stops.forEach((s,i)=>{
    const name=s.c.tags.name||'Stazione DC'; const operator=s.c.tags.operator||'Operatore non specificato'; const stationPower=s.c.power||0; const usablePower=stationPower?Math.min(stationPower,carMaxPower):carMaxPower; const hours=s.add*usablePower>0?s.add/usablePower:0;
    const safety=s.safe?'🟢 Alternativa raggiungibile':'🟠 Nessuna alternativa rilevata'; html+=`<div class="stop"><div class="stoptitle">⚡ Ricarica ${i+1} <span class="badge">${name}</span></div><div class="small">${operator} · circa ${s.km.toFixed(0)} km · arrivo ${s.arrival.toFixed(0)}% → ${s.chargeTo}% · ${stationPower?stationPower+' kW colonnina · ':''}${usablePower.toFixed(0)} kW utilizzabili · ~${Math.round(hours*60)} min · ${safety}</div></div>`;
    const m=L.marker([s.c.lat,s.c.lon]).addTo(map).bindPopup(`<b>${name}</b><br>DC ${stationPower?stationPower+' kW':'potenza non indicata'}<br>Arrivo ~${s.arrival.toFixed(0)}% → ${s.chargeTo}%`);markers.push(m);
  });
  $('plan').innerHTML=html; status.textContent=`Test Modena–Siena: ${cs.length} stazioni DC individuate. MINI max ${carMaxPower} kW; obiettivo ${desired}% alla sosta; riserva ${min}%.`;
 }catch(e){status.textContent=e.message||'Si è verificato un errore.';console.error(e)}
}
$('calc').onclick=calculate;
</script>
</body></html>
